server {
    listen 443 ssl;
    server_name "~^cbt-(?<school>[a-z0-9]{8})\.sityoyitsolutions\.com$";
    ssl_certificate /etc/sis-cbt/fullchain.pem;
    ssl_certificate_key /etc/sis-cbt/privkey.pem;
    root /var/www/cbt-sekolah/public;
    client_max_body_size 32m;
    if (!-f /var/lib/sis-cbt/$school/active-until) { return 403; }

    location ^~ /storage/ {
        alias /var/lib/sis-cbt/$school/storage/app/public/;
        disable_symlinks on;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox" always;
    }
    location ~ ^/(?:build|images|fonts|css|js)/.+\.(?:css|js|woff2?|ttf|png|jpe?g|webp|ico|svg)$ {
        try_files $uri =404;
    }
    location ~ (?:^|/)\. { return 404; }
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/cbt-sekolah/deploy/tenants/http.php;
        fastcgi_param CBT_SCHOOL $school;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
}
server {
    listen 80;
    server_name "~^cbt-[a-z0-9]{8}\.sityoyitsolutions\.com$";
    return 301 https://$host$request_uri;
}
