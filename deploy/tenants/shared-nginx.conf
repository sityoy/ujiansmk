server {
    listen 443 ssl;
    server_name cbt-sekolah.sityoyitsolutions.com;
    ssl_certificate __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    root /var/www/cbt-sekolah/public;
    client_max_body_size 32m;

    location = / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/cbt-sekolah/deploy/tenants/choose.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location ~ ^/(?:build|images|js|css|fonts)/.+\.(?:css|js|woff2?|ttf|png|jpe?g|webp|ico|svg)$ {
        try_files $uri =404;
    }
    location ~ "^/s/(?<filenpsn>[a-z0-9]{8})/storage/(?<upload>[a-zA-Z0-9_/-]+\.[a-zA-Z0-9]+)$" {
        if (!-f /var/lib/sis-cbt/$filenpsn/active-until) { return 403; }
        alias /var/lib/sis-cbt/$filenpsn/storage/app/public/$upload;
        disable_symlinks on;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox" always;
    }
    location ~ "^/s/(?<npsn>[a-z0-9]{8})/" {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/cbt-sekolah/deploy/tenants/http.php;
        fastcgi_param CBT_SCHOOL $npsn;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location / { return 404; }
}
